<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIS Knowledge Portal — University of Phoenix</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-elev: #121933;
      --bg-card: #161f3f;
      --bg-hover: #1d2952;
      --border: #26335e;
      --text: #edf2ff;
      --text-muted: #9aa7cc;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --ai: #06b6d4;
      --ai-soft: rgba(6, 182, 212, 0.16);
      --gold: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    [data-theme="light"] {
      --bg: #f4f6fb;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #eef2ff;
      --border: #dce3f2;
      --text: #111827;
      --text-muted: #52607a;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --ai: #0891b2;
      --ai-soft: rgba(8, 145, 178, 0.12);
      --shadow: 0 6px 18px rgba(17, 24, 39, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-elev);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .nav-section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 10px 2px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 9px 11px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: var(--bg-hover); }
    .nav-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 600;
    }
    .nav-btn.ai-featured.active {
      background: var(--ai-soft);
      border-color: var(--ai);
    }
    .nav-label {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge-count {
      font-size: 0.75rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ai-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--ai-soft);
      color: var(--ai);
      border: 1px solid var(--ai);
      margin-left: 4px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-row {
      display: flex;
      gap: 8px;
    }

    /* Main area */
    .main {
      flex: 1;
      padding: 24px 28px 48px;
      max-width: 1400px;
      width: 100%;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 0.94rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    select, .btn {
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
    .btn-ghost { background: transparent; }

    /* Hero / Context Header */
    .section-header {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .section-header.ai-banner {
      border-color: var(--ai);
      background: linear-gradient(135deg, var(--bg-elev), var(--ai-soft));
    }
    .section-title { font-size: 1.35rem; font-weight: 700; }
    .section-desc { font-size: 0.9rem; color: var(--text-muted); margin-top: 3px; }

    /* AI sub-track chips */
    .chip-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { color: var(--text); border-color: var(--ai); }
    .chip.active {
      background: var(--ai);
      border-color: var(--ai);
      color: #fff;
      font-weight: 600;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: transform 0.14s, border-color 0.14s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card.is-ai:hover { border-color: var(--ai); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tag.ai { background: var(--ai-soft); color: var(--ai); }
    .tag.neutral {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
    .icon-btn.starred { color: var(--gold); border-color: var(--gold); }

    .card-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }
    .card-title:hover { color: var(--accent); text-decoration: underline; }
    .card.is-ai .card-title:hover { color: var(--ai); }

    .card-desc {
      font-size: 0.87rem;
      color: var(--text-muted);
      flex: 1;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mini-tag {
      font-size: 0.73rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .open-link {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .card.is-ai .open-link { color: var(--ai); }
    .open-link:hover { text-decoration: underline; }

    .note-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .note-box.open { display: flex; }
    .note-area {
      width: 100%;
      min-height: 76px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      resize: vertical;
    }
    .note-hint { font-size: 0.74rem; color: var(--success); }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--bg-elev);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 1.15rem; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    @media (max-width: 860px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main { padding: 18px 16px 40px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">🎓 MIS Knowledge Portal</div>
      <div class="brand-sub">University of Phoenix • MIS & Deep AI Hub</div>
    </div>
    <img src="antigravity-robot.png" alt="AntiGravity robot mascot (AI-generated image)" style="width:100%; border-radius:12px; margin:4px 0 12px; display:block;" />

    <div>
      <div class="nav-section-label">Views</div>
      <div class="nav-list" id="quickNav"></div>
    </div>

    <div>
      <div class="nav-section-label">MIS & AI Domains</div>
      <div class="nav-list" id="categoryNav"></div>
    </div>

    <div class="sidebar-footer">
      <div class="footer-row">
        <button class="btn btn-sm" id="themeBtn" style="flex:1;">☀️ Light Mode</button>
        <button class="btn btn-sm" id="exportBtn" style="flex:1;">⬇️ Export</button>
      </div>
      <label class="btn btn-sm" style="text-align:center; display:block;">
        ⬆️ Import Backup
        <input type="file" id="importInput" accept="application/json" style="display:none;" />
      </label>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search knowledge bases, frameworks, SQL, AI, NIST, or your notes..." />
      </div>
      <div class="controls">
        <select id="typeFilter" aria-label="Filter by resource type">
          <option value="all">All Resource Types</option>
          <option value="Knowledge Base">Knowledge Base</option>
          <option value="Course / Learning">Course / Learning</option>
          <option value="Framework / Standard">Framework / Standard</option>
          <option value="Tool / Sandbox">Tool / Sandbox</option>
          <option value="Research / Journal">Research / Journal</option>
        </select>
        <button class="btn btn-primary" id="addBtn">+ Add Resource</button>
      </div>
    </div>

    <div class="section-header" id="sectionHeader">
      <div>
        <div class="section-title" id="sectionTitle">All MIS & AI Resources</div>
        <div class="section-desc" id="sectionDesc">Curated knowledge bases, standards, tools, and research hubs for your MIS degree.</div>
      </div>
      <div class="badge-count" id="resultCount">0 resources</div>
    </div>

    <div class="chip-bar" id="aiTrackBar" style="display:none;"></div>

    <section class="grid" id="cardsGrid"></section>
  </main>

  <!-- Add Resource Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Add Custom Resource</h2>
      <form id="addForm">
        <div class="field">
          <label for="fTitle">Title *</label>
          <input id="fTitle" required placeholder="e.g., UOPX MIS Capstone Library Guide" />
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="fUrl">URL *</label>
          <input id="fUrl" type="url" required placeholder="https://..." />
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="fCategory">Domain *</label>
          <select id="fCategory"></select>
        </div>
        <div class="field" id="fAiTrackWrap" style="margin-top:8px; display:none;">
          <label for="fAiTrack">AI Sub-Track</label>
          <select id="fAiTrack">
            <option value="Foundations">Foundations</option>
            <option value="LLMs & Prompting">LLMs & Prompting</option>
            <option value="RAG & Agents">RAG & Agents</option>
            <option value="Enterprise Strategy">Enterprise Strategy</option>
            <option value="Governance & Risk">Governance & Risk</option>
            <option value="Research & Benchmarks">Research & Benchmarks</option>
          </select>
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="fType">Resource Type</label>
          <select id="fType">
            <option value="Knowledge Base">Knowledge Base</option>
            <option value="Course / Learning">Course / Learning</option>
            <option value="Framework / Standard">Framework / Standard</option>
            <option value="Tool / Sandbox">Tool / Sandbox</option>
            <option value="Research / Journal">Research / Journal</option>
          </select>
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="fDesc">Description</label>
          <textarea id="fDesc" rows="2" placeholder="Why this resource is useful for your coursework..."></textarea>
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="fTags">Tags (comma-separated)</label>
          <input id="fTags" placeholder="UOPX, Syllabus, SQL, Week 1" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Resource</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      custom: "uopx_mis_portal_v1_custom",
      bookmarks: "uopx_mis_portal_v1_bookmarks",
      notes: "uopx_mis_portal_v1_notes",
      theme: "uopx_mis_portal_v1_theme"
    };

    const CATEGORIES = [
      {

        desc: "Python, web fundamentals, REST API testing, Git version control, and interactive career/skills roadmaps."

    const AI_TRACKS = [
      "All AI",
      "Foundations",
      "LLMs & Prompting",
      "RAG & Agents",
      "Enterprise Strategy",
      "Governance & Risk",
      "Research & Benchmarks"

    const SEED_RESOURCES = [
      // === AI DEEP DIVE ===
      { id: "ai-1", category: "ai", aiTrack: "Foundations", type: "Course / Learning", title: "DeepLearning.AI", url: "https://www.deeplearning.ai/", desc: "Industry-standard short courses and specializations covering ML fundamentals, generative AI, RAG, and agentic workflows.", tags: ["ML", "GenAI", "Short Courses"] },
      { id: "ai-2", category: "ai", aiTrack: "Foundations", type: "Course / Learning", title: "Google Machine Learning Crash Course", url: "https://developers.google.com/machine-learning/crash-course", desc: "Free hands-on ML curriculum with interactive visualizations covering regression, classification, neural networks, and LLMs.", tags: ["ML", "Hands-On", "Free"] },

      { id: "ai-4", category: "ai", aiTrack: "Foundations", type: "Course / Learning", title: "3Blue1Brown — Neural Networks & Transformers", url: "https://www.3blue1brown.com/topics/neural-networks", desc: "Best visual intuition on the internet for backpropagation, attention mechanisms, and how transformers actually work.", tags: ["Transformers", "Intuition", "Visual"] },

      { id: "ai-6", category: "ai", aiTrack: "LLMs & Prompting", type: "Knowledge Base", title: "Anthropic Documentation & Prompt Engineering", url: "https://docs.anthropic.com/", desc: "Deep guidance on prompt engineering, context management, tool use, evals, and building reliable LLM systems.", tags: ["Prompting", "Evals", "Context"] },

      { id: "ai-8", category: "ai", aiTrack: "LLMs & Prompting", type: "Knowledge Base", title: "Google Gemini API Documentation", url: "https://ai.google.dev/gemini-api/docs", desc: "Multimodal AI guides covering long-context processing, grounding, function calling, and structured generation.", tags: ["Multimodal", "Long Context", "API"] },
      { id: "ai-9", category: "ai", aiTrack: "LLMs & Prompting", type: "Knowledge Base", title: "Prompt Engineering Guide (DAIR.AI)", url: "https://www.promptingguide.ai/", desc: "Open-source living handbook covering zero/few-shot, chain-of-thought, ReAct, RAG prompting, and adversarial safety.", tags: ["Techniques", "Open Source", "CoT"] },

    ];

    // State
    let state = {
      view: "all", // "all" | "bookmarks" | categoryId
      aiTrack: "All AI",
      typeFilter: "all",
      search: "",
      customResources: [],
      bookmarks: new Set(),
      notes: {},
      openNotes: new Set()
    };

    function loadState() {
      try {
        const c = JSON.parse(localStorage.getItem(STORAGE_KEYS.custom) || "[]");
        if (Array.isArray(c)) state.customResources = c;
        const b = JSON.parse(localStorage.getItem(STORAGE_KEYS.bookmarks) || "[]");
        if (Array.isArray(b)) state.bookmarks = new Set(b);
        const n = JSON.parse(localStorage.getItem(STORAGE_KEYS.notes) || "{}");
        if (n && typeof n === "object") state.notes = n;
        const theme = localStorage.getItem(STORAGE_KEYS.theme) || "dark";
        applyTheme(theme);
      } catch (e) {
        console.warn("Could not load localStorage state:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEYS.custom, JSON.stringify(state.customResources));
        localStorage.setItem(STORAGE_KEYS.bookmarks, JSON.stringify([...state.bookmarks]));
        localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(state.notes));
      } catch (e) {
        console.warn("Could not persist localStorage state:", e);
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(STORAGE_KEYS.theme, theme);
      document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getAllResources() {
      return [...state.customResources, ...SEED_RESOURCES];
    }

    function getCategoryMeta(id) {
      return CATEGORIES.find(c => c.id === id);
    }

    function getFilteredResources() {
      const q = state.search.trim().toLowerCase();
      return getAllResources().filter(item => {
        if (state.view === "bookmarks" && !state.bookmarks.has(item.id)) return false;
        if (state.view !== "all" && state.view !== "bookmarks" && item.category !== state.view) return false;
        if (state.view === "ai" && state.aiTrack !== "All AI" && item.aiTrack !== state.aiTrack) return false;
        if (state.typeFilter !== "all" && item.type !== state.typeFilter) return false;
        if (q) {
          const note = (state.notes[item.id] || "").toLowerCase();
          const haystack = [
            item.title,
            item.desc,
            item.type,
            item.aiTrack || "",
            ...(item.tags || []),
            note
          ].join(" ").toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

    function renderSidebar() {
      const all = getAllResources();
      const quickNav = document.getElementById("quickNav");
      quickNav.innerHTML = `
        <button class="nav-btn ${state.view === "all" ? "active" : ""}" data-view="all">
          <span class="nav-label">🌐 All Resources</span>
          <span class="badge-count">${all.length}</span>
        </button>
        <button class="nav-btn ${state.view === "bookmarks" ? "active" : ""}" data-view="bookmarks">
          <span class="nav-label">⭐ Starred / Bookmarks</span>
          <span class="badge-count">${state.bookmarks.size}</span>
        </button>
      `;

      const catNav = document.getElementById("categoryNav");
      catNav.innerHTML = CATEGORIES.map(cat => {
        const count = all.filter(r => r.category === cat.id).length;
        const active = state.view === cat.id ? "active" : "";
        const feat = cat.featured ? "ai-featured" : "";
        const pill = cat.featured ? `<span class="ai-pill">DEEP</span>` : "";
        return `
          <button class="nav-btn ${active} ${feat}" data-view="${cat.id}">
            <span class="nav-label">${cat.icon} ${escapeHtml(cat.name)} ${pill}</span>
            <span class="badge-count">${count}</span>
          </button>
        `;
      }).join("");
    }

    function renderHeaderAndChips(filteredCount) {
      const header = document.getElementById("sectionHeader");
      const titleEl = document.getElementById("sectionTitle");
      const descEl = document.getElementById("sectionDesc");
      const chipBar = document.getElementById("aiTrackBar");
      const countEl = document.getElementById("resultCount");

      header.classList.toggle("ai-banner", state.view === "ai");
      countEl.textContent = `${filteredCount} resource${filteredCount === 1 ? "" : "s"}`;

      if (state.view === "all") {
        titleEl.textContent = "All MIS & AI Knowledge Sources";
        descEl.textContent = "Curated knowledge bases, frameworks, datasets, journals, and AI hubs aligned with a University of Phoenix MIS program.";
      } else if (state.view === "bookmarks") {
        titleEl.textContent = "⭐ Starred & Bookmarked Resources";
        descEl.textContent = "Your pinned go-to references for current classes, discussion posts, and projects.";
      } else {
        const cat = getCategoryMeta(state.view);
        titleEl.textContent = `${cat.icon} ${cat.name}`;
        descEl.textContent = cat.desc;
      }

      if (state.view === "ai") {
        chipBar.style.display = "flex";
        chipBar.innerHTML = AI_TRACKS.map(track => `
          <button class="chip ${state.aiTrack === track ? "active" : ""}" data-track="${escapeHtml(track)}">
            ${escapeHtml(track)}
          </button>
        `).join("");
      } else {
        chipBar.style.display = "none";
      }
    }

    function renderCards() {
      const items = getFilteredResources();
      renderHeaderAndChips(items.length);

      const grid = document.getElementById("cardsGrid");
      if (!items.length) {
        grid.innerHTML = `
          <div class="empty" style="grid-column: 1 / -1;">
            <h3>No matching resources found</h3>
            <p style="margin-top:6px;">Try clearing your search filter, switching resource type, or adding your own link with "+ Add Resource".</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(item => {
        const cat = getCategoryMeta(item.category);
        const isAi = item.category === "ai";
        const starred = state.bookmarks.has(item.id);
        const noteText = state.notes[item.id] || "";
        const hasNote = noteText.trim().length > 0;
        const noteOpen = state.openNotes.has(item.id);
        const isCustom = String(item.id).startsWith("custom-");

        return `
          <article class="card ${isAi ? "is-ai" : ""}" data-id="${escapeHtml(item.id)}">
            <div class="card-top">
              <div class="card-badges">
                <span class="tag ${isAi ? "ai" : ""}">${cat ? escapeHtml(cat.name) : "Resource"}</span>
                ${item.aiTrack ? `<span class="tag ai">${escapeHtml(item.aiTrack)}</span>` : ""}
                <span class="tag neutral">${escapeHtml(item.type)}</span>
              </div>
              <button class="icon-btn ${starred ? "starred" : ""}" data-action="star" title="Bookmark">
                ${starred ? "★" : "☆"}
              </button>
            </div>

            <a class="card-title" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(item.title)}
            </a>

            <p class="card-desc">${escapeHtml(item.desc)}</p>

            <div class="card-meta">
              ${(item.tags || []).map(t => `<span class="mini-tag">#${escapeHtml(t)}</span>`).join("")}
            </div>

            <div class="card-actions">
              <a class="open-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                Open Resource ↗
              </a>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-sm btn-ghost" data-action="toggle-note">
                  📝 ${hasNote ? "Notes (1)" : "Notes"}
                </button>
                ${isCustom ? `<button class="btn btn-sm btn-ghost" data-action="delete" style="color:var(--danger);">Delete</button>` : ""}
              </div>
            </div>

            <div class="note-box ${noteOpen ? "open" : ""}">
              <textarea class="note-area" data-action="edit-note" placeholder="Add UOPX course notes, APA citation reminders, or key takeaways...">${escapeHtml(noteText)}</textarea>
              <span class="note-hint">Auto-saved locally in this browser</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderSidebar();
      renderCards();
    }

    function populateCategorySelect() {
      const sel = document.getElementById("fCategory");
      sel.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    }

    // Event wiring
    document.addEventListener("click", (e) => {
      const navBtn = e.target.closest(".nav-btn");
      if (navBtn) {
        state.view = navBtn.dataset.view;
        state.aiTrack = "All AI";
        renderAll();
        return;
      }

      const chip = e.target.closest(".chip");
      if (chip) {
        state.aiTrack = chip.dataset.track;
        renderCards();
        return;
      }

      const card = e.target.closest(".card");
      const actionBtn = e.target.closest("[data-action]");
      if (card && actionBtn) {
        const id = card.dataset.id;
        const action = actionBtn.dataset.action;

        if (action === "star") {
          if (state.bookmarks.has(id)) state.bookmarks.delete(id);
          else state.bookmarks.add(id);
          saveState();
          renderAll();
        } else if (action === "toggle-note") {
          if (state.openNotes.has(id)) state.openNotes.delete(id);
          else state.openNotes.add(id);
          renderCards();
        } else if (action === "delete") {
          if (confirm("Delete this custom resource?")) {
            state.customResources = state.customResources.filter(r => r.id !== id);
            state.bookmarks.delete(id);
            delete state.notes[id];
            saveState();
            renderAll();
          }
        }
      }
    });

    document.addEventListener("input", (e) => {
      if (e.target.id === "searchInput") {
        state.search = e.target.value;
        renderCards();
      } else if (e.target.dataset.action === "edit-note") {
        const card = e.target.closest(".card");
        if (card) {
          state.notes[card.dataset.id] = e.target.value;
          saveState();
        }
      }
    });

    document.getElementById("typeFilter").addEventListener("change", (e) => {
      state.typeFilter = e.target.value;
      renderCards();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    // Modal handling
    const backdrop = document.getElementById("modalBackdrop");
    const fCategory = document.getElementById("fCategory");
    const fAiTrackWrap = document.getElementById("fAiTrackWrap");

    function syncAiTrackVisibility() {
      fAiTrackWrap.style.display = fCategory.value === "ai" ? "flex" : "none";
    }
    fCategory.addEventListener("change", syncAiTrackVisibility);

    document.getElementById("addBtn").addEventListener("click", () => {
      if (state.view !== "all" && state.view !== "bookmarks") {
        fCategory.value = state.view;
      }
      syncAiTrackVisibility();
      backdrop.classList.add("open");
      document.getElementById("fTitle").focus();
    });

    document.getElementById("cancelModal").addEventListener("click", () => backdrop.classList.remove("open"));
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.classList.remove("open"); });

    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const cat = fCategory.value;
      const tagsRaw = document.getElementById("fTags").value;
      const newRes = {
        id: "custom-" + Date.now(),
        category: cat,
        aiTrack: cat === "ai" ? document.getElementById("fAiTrack").value : undefined,
        type: document.getElementById("fType").value,
        title: document.getElementById("fTitle").value.trim(),
        url: document.getElementById("fUrl").value.trim(),
        desc: document.getElementById("fDesc").value.trim() || "Custom saved resource.",
        tags: tagsRaw ? tagsRaw.split(",").map(s => s.trim()).filter(Boolean) : ["Custom"]
      };
      state.customResources.unshift(newRes);
      saveState();
      e.target.reset();
      backdrop.classList.remove("open");
      renderAll();
    });

    // Export / Import JSON backup
    document.getElementById("exportBtn").addEventListener("click", () => {
      const payload = {
        exportedAt: new Date().toISOString(),
        customResources: state.customResources,
        bookmarks: [...state.bookmarks],
        notes: state.notes
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mis-portal-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (Array.isArray(data.customResources)) state.customResources = data.customResources;
          if (Array.isArray(data.bookmarks)) state.bookmarks = new Set(data.bookmarks);
          if (data.notes && typeof data.notes === "object") state.notes = data.notes;
          saveState();
          renderAll();
          alert("Backup imported successfully!");
        } catch {
          alert("Invalid backup JSON file.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    populateCategorySelect();
    loadState();
    renderAll();
  </script>
</body>
</html>
